[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jperkey/SignalPlayback"
authors = ["Justin Perkey"]

[workspace.dependencies]
# Internal crates. Dependencies point left-to-right only (see docs/DESIGN.md §4.1).
sp-core = { path = "crates/sp-core" }
sp-store = { path = "crates/sp-store" }
sp-csv = { path = "crates/sp-csv" }
sp-gen = { path = "crates/sp-gen" }
sp-proc = { path = "crates/sp-proc" }
sp-dsp = { path = "crates/sp-dsp" }
sp-ext = { path = "crates/sp-ext" }
sp-ext-sample = { path = "crates/sp-ext-sample" }
sp-engine = { path = "crates/sp-engine" }

# GUI. Pinned to a minor version: Iced churns between releases (§18) and all
# usage is confined to sp-app.
iced = { version = "0.13.1", features = ["canvas", "tokio", "advanced"] }

# Native file dialogs. The XDG portal backend keeps the Linux build free of
# GTK development headers, which CI would otherwise have to install.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

rusqlite = { version = "0.40", default-features = false, features = ["bundled", "blob", "cache"] }
blake3 = "1.8"

# Dynamic library loading for external stages (§9.9). Platform detail — the
# unsafe surface is confined to sp-ext.
libloading = "0.8"

# Generation. `ChaCha12Rng` is seekable, so a noise stream is addressable by
# sample index and a chunk renders the same as the whole range (G3).
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
rayon = "1.11"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync"] }
tempfile = "3.27"
proptest = "1.9"
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` makes the parser return the exact `f64` that was written.
# Without it serde_json can come back a bit out on some values, which would
# break the promise that a stored `gen_spec` re-renders bit-identical samples
# (G3) and that an attribute survives export unchanged (G1).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "6.0"

[workspace.lints.rust]
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
uninlined_format_args = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# A shipped binary carries no debug symbols: it is a third of the size, and a
# panic still names the function it came from through the backtrace the
# runtime prints.
strip = "debuginfo"

# Sample-crunching is unusably slow in an unoptimised debug build; the app code
# itself stays at opt-level 0 so debugging the UI still works.
[profile.dev.package."*"]
opt-level = 2
